<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Border & Background -->
  <rect width="800" height="550" rx="20" fill="url(#bgGrad)"/>
  <rect x="25" y="25" width="750" height="500" rx="12" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="6,4"/>
  <rect x="35" y="35" width="730" height="480" rx="8" fill="none" stroke="#334155" stroke-width="1"/>

  <!-- Top Ribbon Header -->
  <path d="M 320 35 L 480 35 L 460 70 L 340 70 Z" fill="url(#goldGrad)"/>
  <text x="400" y="58" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle" letter-spacing="2">OFFICIAL CERTIFICATE</text>

  <!-- Issuer Logos -->
  <text x="400" y="115" font-family="'Inter', sans-serif" font-size="20" font-weight="bold" fill="#38bdf8" text-anchor="middle" letter-spacing="1">SKILL ARBITRAGE &amp; SKILL INDIA</text>
  <text x="400" y="138" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Professional Certification Program</text>

  <!-- Title -->
  <text x="400" y="195" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle" letter-spacing="3">THIS IS TO CERTIFY THAT</text>
  <text x="400" y="245" font-family="'Georgia', serif" font-size="38" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle">NIRAJ PAWAR</text>
  
  <text x="400" y="295" font-family="'Inter', sans-serif" font-size="14" fill="#e2e8f0" text-anchor="middle">has successfully completed the certification requirement in</text>
  <text x="400" y="335" font-family="'Inter', sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">Data Science &amp; AI</text>

  <!-- Credential Box -->
  <rect x="220" y="370" width="360" height="45" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="400" y="398" font-family="monospace" font-size="14" font-weight="bold" fill="#fbbf24" text-anchor="middle">Credential ID: CERT_2336792</text>

  <!-- Footer Seal -->
  <circle cx="120" cy="455" r="30" fill="url(#goldGrad)" opacity="0.2"/>
  <circle cx="120" cy="455" r="24" stroke="url(#goldGrad)" stroke-width="2" fill="none"/>
  <text x="120" y="460" font-family="sans-serif" font-size="10" font-weight="bold" fill="#fbbf24" text-anchor="middle">VERIFIED</text>

  <text x="400" y="460" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Issued: February 2025 • Verified Credential</text>
</svg>
